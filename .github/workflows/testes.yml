# Roda a bateria de testes a cada push e pull request.
# Windows é o ambiente real de uso destes projetos, então é nele que testamos.
name: testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar as dependências
        # --locked falha se o uv.lock estiver desatualizado em relação ao
        # pyproject.toml: garante que o lock versionado é o que realmente roda.
        run: uv sync --locked

      - name: Rodar os testes
        run: uv run pytest -q
