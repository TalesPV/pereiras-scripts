[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pereiras-common"
version = "0.4.0"
description = "Funções Python compartilhadas entre projetos locais"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Tales Pereira Vasconcelos" }
]
keywords = ["metadata", "exif", "gps", "ffmpeg", "pillow", "mutagen"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "defusedxml>=0.7.1",
  "exifread>=3.0.0",
  "google-genai>=2.18.1",
  "imageio-ffmpeg>=0.5.0",
  "mutagen>=1.47.0",
  "openai>=3.1.0",
  "piexif>=1.1.3",
  "pillow>=10.0.0",
  "pillow-heif>=0.16.0",
  "platformdirs>=4.11.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pereiras_common"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
